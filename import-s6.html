const logEl = document.getElementById('log');
function log(msg, cls='info') {
  const p = document.createElement('p');
  p.className = cls;
  p.textContent = msg;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
}
function setBar(pct) {
  document.getElementById('bar-wrap').style.display = 'block';
  document.getElementById('bar').style.width = pct + '%';
}

async function run() {
  document.getElementById('btn').disabled = true;
  logEl.innerHTML = '';

  // Step 1: delete bad EMPTY record
  log('Removing incomplete records...', 'info');
  await sb.from('participants').delete().eq('phone', 'EMPTY');
  setBar(5);

  // Step 2: upsert participants in one batch
  log(`Importing ${PARTICIPANTS.length} participants...`, 'info');
  const { error: pErr } = await sb.from('participants')
    .upsert(PARTICIPANTS, { onConflict: 'phone', ignoreDuplicates: false });
  if (pErr) {
    log('Participant error: ' + pErr.message, 'err');
  } else {
    log(`✓ ${PARTICIPANTS.length} participants imported`, 'ok');
  }
  setBar(20);

  // Step 3: upsert checkins in batches of 200
  log(`Importing ${CHECKINS.length} checkins...`, 'info');
  const BATCH = 200;
  let errors = 0;
  for (let i = 0; i < CHECKINS.length; i += BATCH) {
    const batch = CHECKINS.slice(i, i + BATCH);
    const { error } = await sb.from('checkins')
      .upsert(batch, { onConflict: 'phone,date', ignoreDuplicates: true });
    if (error) {
      errors++;
      log(`  Batch ${Math.floor(i/BATCH)+1} error: ${error.message}`, 'err');
    }
    setBar(20 + Math.round(((i + batch.length) / CHECKINS.length) * 78));
  }

  setBar(100);
  if (errors === 0) {
    log(`✓ ${CHECKINS.length} checkins imported`, 'ok');
    document.getElementById('done').style.display = 'block';
  } else {
    log(`Done with ${errors} batch errors. Check above for details.`, 'err');
  }
  document.getElementById('btn').textContent = 'Import Complete';
}
